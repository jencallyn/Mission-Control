<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Control</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f4f5f7; --card: #ffffff; --border: #e8eaed;
  --text: #111827; --soft: #6b7280; --urgent: #dc2626;
  --overlap: #d97706; --blue: #2563eb; --green: #16a34a; --radius: 10px;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

/* HEADER */
#header { background: #0f172a; padding: 14px 24px 12px; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
#header h1 { font-size: 1rem; font-weight: 700; color: white; }
#header h1 span { color: #60a5fa; }
#header-right { display: flex; align-items: center; gap: 12px; }
#date-display { font-size: 0.72rem; color: #64748b; }
.ctrl-btn { font-size: 0.68rem; padding: 4px 10px; cursor: pointer; background: #1e293b; color: #64748b; border: 1px solid #334155; border-radius: 6px; font-weight: 600; }
.ctrl-btn:hover { color: #ef4444; border-color: #ef4444; }

/* MISSION BAR */
#mission-bar { background: #1e293b; border-bottom: 1px solid #334155; padding: 10px 24px; display: flex; align-items: center; gap: 10px; }
#mission-icon { font-size: 1rem; }
#mission-label { font-size: 0.62rem; color: #60a5fa; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; white-space: nowrap; }
#mission-text { font-size: 0.82rem; font-weight: 600; color: #e2e8f0; }

/* PAGE */
#page { max-width: 900px; margin: 0 auto; padding: 20px 20px 60px; display: flex; flex-direction: column; gap: 14px; }
.section-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

/* EMERGENCY */
#emergency { padding: 12px 16px; display: flex; gap: 10px; align-items: flex-start; background: #fef2f2; border-color: #fecaca; }
#emergency .em-icon { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }
#emergency h3 { font-size: 0.68rem; font-weight: 800; color: var(--urgent); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
#emergency p  { font-size: 0.75rem; color: #7f1d1d; line-height: 1.6; }
#emergency a  { color: var(--urgent); font-weight: 700; text-decoration: none; }

/* TODAY'S FOCUS HEADER */
#focus-header { background: linear-gradient(135deg, #4f46e5, #2563eb); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
#focus-title { font-size: 0.9rem; font-weight: 800; color: white; }
#focus-date  { font-size: 0.68rem; color: rgba(255,255,255,.65); margin-top: 1px; }
#focus-count { font-size: 0.68rem; font-weight: 700; color: rgba(255,255,255,.8); background: rgba(255,255,255,.15); padding: 3px 9px; border-radius: 20px; }
#focus-body  { padding: 0; }

/* TODAY'S FOCUS — SINGLE TASK CARD */
#focus-single { padding: 18px 18px 16px; }
.fs-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.fs-urgent-badge { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.7px; padding: 2px 7px; border-radius: 6px; background: #fef2f2; color: var(--urgent); border: 1px solid #fecaca; display: flex; align-items: center; gap: 4px; }
.fs-urgent-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--urgent); animation: pulse 1.6s infinite; }
.fs-proj-tag { font-size: 0.65rem; font-weight: 700; color: var(--soft); }
.fs-overlap-badge { font-size: 0.6rem; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: #fffbeb; color: #d97706; border: 1px solid #fde68a; display: inline-flex; align-items: center; gap: 3px; }
.fs-title { font-size: 1.08rem; font-weight: 800; color: var(--text); line-height: 1.35; margin-bottom: 11px; }
.fs-notes { font-size: 0.77rem; color: #374151; line-height: 1.6; margin-bottom: 13px; background: #f8fafc; border-left: 3px solid #cbd5e1; padding: 9px 12px; border-radius: 0 7px 7px 0; }
.fs-links { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
.fs-phone, .fs-url { font-size: 0.76rem; font-weight: 700; padding: 7px 13px; border-radius: 7px; border: 1.5px solid; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; transition: all .15s; }
.fs-phone { background: #eff6ff; color: var(--blue); border-color: #bfdbfe; }
.fs-phone:hover { background: var(--blue); color: white; border-color: var(--blue); }
.fs-url { background: #f0fdf4; color: var(--green); border-color: #bbf7d0; }
.fs-url:hover { background: var(--green); color: white; border-color: var(--green); }
.fs-actions { display: flex; gap: 10px; }
.fs-btn-done { flex: 2; padding: 12px 16px; border: none; border-radius: 8px; font-size: 0.88rem; font-weight: 800; cursor: pointer; background: linear-gradient(135deg, #16a34a, #0d9488); color: white; box-shadow: 0 2px 10px rgba(22,163,74,.28); transition: all .2s; }
.fs-btn-done:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(22,163,74,.4); }
.fs-btn-skip { flex: 1; padding: 12px 12px; border: 1.5px solid #e5e7eb; border-radius: 8px; font-size: 0.78rem; font-weight: 600; cursor: pointer; background: white; color: var(--soft); transition: all .15s; }
.fs-btn-skip:hover { border-color: var(--overlap); color: var(--overlap); background: #fffbeb; }
.fs-remaining { text-align: center; font-size: 0.65rem; color: #9ca3af; margin-top: 10px; }
.focus-weekend { text-align: center; padding: 32px 20px; }
.focus-weekend .w-emoji { font-size: 2.5rem; margin-bottom: 10px; }
.focus-weekend .w-main { font-size: 1.05rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.focus-weekend .w-sub  { font-size: 0.78rem; color: var(--soft); }
.focus-empty { text-align: center; padding: 24px; font-size: 0.85rem; color: var(--green); font-weight: 600; }

/* OVERLAP PANEL */
#overlap-toggle { display: flex; align-items: center; justify-content: space-between; padding: 11px 16px; cursor: pointer; user-select: none; }
#overlap-toggle:hover { background: #fffdf5; }
#overlap-toggle-left { display: flex; align-items: center; gap: 8px; }
#overlap-label { font-size: 0.72rem; font-weight: 700; color: #92400e; text-transform: uppercase; letter-spacing: 0.5px; }
#overlap-pill { font-size: 0.62rem; font-weight: 700; background: #fef3c7; color: #92400e; border: 1px solid #fde68a; padding: 2px 7px; border-radius: 10px; }
#overlap-chevron { font-size: 0.75rem; color: #92400e; transition: transform .2s; }
#overlap-body { border-top: 1px solid #fde68a; }
#overlap-section { border-color: #fde68a; background: #fffbeb; }
.overlap-row { border-bottom: 1px solid #fde68a; }
.overlap-row:last-child { border-bottom: none; }
.ov-top { display: flex; align-items: center; gap: 8px; padding: 10px 16px; cursor: pointer; transition: background .1s; }
.ov-top:hover { background: #fef3c7; }
.overlap-row.ov-expanded .ov-top { background: #fef3c7; }
.ov-badge { font-size: 0.6rem; font-weight: 800; background: var(--overlap); color: white; padding: 2px 7px; border-radius: 8px; white-space: nowrap; flex-shrink: 0; }
.ov-title { flex: 1; font-size: 0.8rem; font-weight: 700; color: #78350f; }
.ov-expand { font-size: 0.7rem; color: #d97706; transition: transform .2s; flex-shrink: 0; }
.overlap-row.ov-expanded .ov-expand { transform: rotate(90deg); }
.ov-details { display: none; padding: 0 16px 10px 16px; border-top: 1px solid #fde68a; }
.overlap-row.ov-expanded .ov-details { display: block; animation: fadeIn .15s ease; }
.ov-desc  { color: #92400e; line-height: 1.5; font-size: 0.75rem; margin-top: 8px; }
.ov-projects { font-size: 0.68rem; color: #b45309; margin-top: 5px; font-weight: 700; }

/* PROJECT GRID */
#projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px,1fr)); gap: 14px; }
.proj-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.proj-head { padding: 12px 14px; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 11px; }
.proj-head:hover { filter: brightness(.97); }
.proj-icon { font-size: 1.2rem; flex-shrink: 0; }
.proj-info { flex: 1; }
.proj-name { font-size: 0.88rem; font-weight: 700; color: white; }
.proj-desc { font-size: 0.68rem; color: rgba(255,255,255,.7); margin-top: 1px; }
.proj-prog-wrap { display: flex; align-items: center; gap: 7px; margin-top: 5px; }
.proj-bar { flex: 1; height: 3px; background: rgba(255,255,255,.25); border-radius: 3px; overflow: hidden; }
.proj-bar-fill { height: 100%; background: rgba(255,255,255,.85); border-radius: 3px; transition: width .3s; }
.proj-frac { font-size: 0.62rem; color: rgba(255,255,255,.75); font-weight: 600; }
.proj-chev { font-size: 0.7rem; color: rgba(255,255,255,.6); transition: transform .2s; }
.proj-card.collapsed .proj-chev { transform: rotate(-90deg); }
.proj-body { padding: 6px 0 10px; }
.proj-card.collapsed .proj-body { display: none; }
.task-group-lbl { font-size: 0.58rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.7px; color: var(--soft); padding: 8px 14px 3px; border-top: 1px solid var(--border); }
.task-group-lbl:first-child { border-top: none; }
.task-group-lbl.urgent { color: var(--urgent); }
.task-group-lbl.week   { color: #7c3aed; }

/* TASK ROWS */
.task-row { cursor: pointer; border-bottom: 1px solid transparent; transition: background .1s; }
.task-row:hover { background: #f9fafb; }
.task-row.expanded { background: #f0f6ff; border-bottom-color: #dbeafe; }
.task-row.inprog   { background: #f0f6ff; }
.task-top { display: flex; align-items: center; gap: 8px; padding: 9px 14px; }
.task-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; background: var(--border); margin-top: 1px; }
.task-row.urgent-row .task-dot { background: var(--urgent); animation: pulse 1.6s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
@keyframes fadeIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }
.task-label { flex: 1; font-size: 0.81rem; line-height: 1.4; color: var(--text); }
.task-row.inprog .task-label { color: var(--blue); }
.task-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.t-deadline { font-size: 0.62rem; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: #f1f5f9; color: var(--soft); white-space: nowrap; }
.task-row.urgent-row .t-deadline { background: #fef2f2; color: var(--urgent); }
.t-overlap-dot { font-size: 0.72rem; color: var(--overlap); }
.t-expand { font-size: 0.7rem; color: #cbd5e1; transition: transform .2s; margin-left: 2px; }
.task-row.expanded .t-expand { transform: rotate(90deg); }
.t-btn { font-size: 0.62rem; font-weight: 700; padding: 3px 7px; border-radius: 5px; border: 1px solid; cursor: pointer; transition: all .12s; white-space: nowrap; }
.t-btn-prog { background: #eff6ff; color: var(--blue); border-color: #bfdbfe; }
.t-btn-prog:hover, .t-btn-prog.on { background: var(--blue); color: white; border-color: var(--blue); }
.t-btn-done { background: #f0fdf4; color: var(--green); border-color: #bbf7d0; }
.t-btn-done:hover { background: var(--green); color: white; border-color: var(--green); }
.task-details { display: none; padding: 0 14px 10px 27px; animation: fadeIn .15s ease; }
.task-row.expanded .task-details { display: block; }
.task-notes { font-size: 0.74rem; color: var(--soft); line-height: 1.5; margin-bottom: 6px; }
.task-links { display: flex; flex-wrap: wrap; gap: 5px; }
.t-phone, .t-url { font-size: 0.68rem; font-weight: 600; padding: 3px 8px; border-radius: 6px; border: 1px solid; text-decoration: none; display: inline-block; }
.t-phone { background: #eff6ff; color: var(--blue); border-color: #bfdbfe; }
.t-url   { background: #f0fdf4; color: var(--green); border-color: #bbf7d0; }
.t-overlap-detail { font-size: 0.68rem; font-weight: 700; color: #92400e; background: #fffbeb; border: 1px solid #fde68a; padding: 3px 8px; border-radius: 6px; display: inline-block; }

/* COMPLETED DRAWER */
.done-drawer { border-top: 1px dashed var(--border); margin-top: 4px; }
.done-toggle { font-size: 0.68rem; font-weight: 700; color: var(--green); padding: 7px 14px; cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: 4px; }
.done-toggle:hover { opacity: .75; }
.done-row { display: flex; align-items: center; gap: 8px; padding: 7px 14px; opacity: .5; }
.done-row-text { flex: 1; font-size: 0.78rem; color: var(--soft); text-decoration: line-through; }
.restore-btn { font-size: 0.62rem; font-weight: 700; padding: 2px 7px; border: 1px solid #d1d5db; border-radius: 5px; background: white; color: var(--soft); cursor: pointer; }
.restore-btn:hover { border-color: var(--overlap); color: var(--overlap); background: #fffbeb; }
.proj-done-banner { text-align: center; padding: 14px; font-size: 0.82rem; color: var(--green); font-weight: 600; }

/* QUEST */
#gp-section { overflow: hidden; }
#gp-header { background: linear-gradient(135deg, #0f172a, #1e293b); padding: 14px 18px; }
#gp-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
#gp-title { font-size: 0.88rem; font-weight: 800; color: white; }
#gp-badge { font-size: 0.68rem; font-weight: 700; color: rgba(255,255,255,.85); background: rgba(255,255,255,.15); padding: 3px 10px; border-radius: 20px; }
#gp-progress-dots { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; }
.gp-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.18); transition: all .3s; flex-shrink: 0; }
.gp-dot.done { background: #34d399; }
.gp-dot.current { background: white; animation: gp-pulse 1.8s ease-in-out infinite; }
@keyframes gp-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.4)} 50%{box-shadow:0 0 0 5px rgba(255,255,255,.1)} }
#gp-bar-wrap { height: 4px; background: rgba(255,255,255,.15); border-radius: 4px; overflow: hidden; }
#gp-bar-fill { height: 100%; background: linear-gradient(90deg, #34d399, #059669); border-radius: 4px; transition: width .6s ease; }
.gp-done-item { display: flex; align-items: center; gap: 10px; padding: 7px 18px; border-bottom: 1px solid var(--border); background: #f8fafc; }
.gp-done-check { width: 17px; height: 17px; border-radius: 50%; background: #16a34a; display: flex; align-items: center; justify-content: center; font-size: 0.58rem; color: white; font-weight: 900; flex-shrink: 0; }
.gp-done-text { flex: 1; font-size: 0.76rem; color: #9ca3af; text-decoration: line-through; }
.gp-done-when { font-size: 0.6rem; color: #16a34a; font-weight: 700; white-space: nowrap; }
#gp-active { padding: 16px 18px 14px; }
.gp-mission-num { font-size: 0.58rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #0d9488; margin-bottom: 3px; }
.gp-mission-title { font-size: 1.05rem; font-weight: 800; color: #0f172a; margin-bottom: 2px; line-height: 1.3; }
.gp-mission-when { font-size: 0.68rem; font-weight: 600; color: #6b7280; margin-bottom: 10px; }
.gp-mission-why { font-size: 0.78rem; color: #374151; line-height: 1.55; margin-bottom: 14px; background: #f0fdfa; border-left: 3px solid #0d9488; padding: 9px 12px; border-radius: 0 6px 6px 0; }
.gp-checks { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
.gp-check-item { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; padding: 9px 11px; border-radius: 8px; border: 1.5px solid #e5e7eb; transition: all .15s; background: white; user-select: none; }
.gp-check-item:hover { background: #f0fdfa; border-color: #99f6e4; }
.gp-check-item.checked { background: #f0fdf4; border-color: #86efac; }
.gp-checkbox { width: 20px; height: 20px; border: 2px solid #d1d5db; border-radius: 4px; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 900; color: white; transition: all .15s; }
.gp-check-item.checked .gp-checkbox { background: #16a34a; border-color: #16a34a; }
.gp-check-content { flex: 1; }
.gp-check-text { font-size: 0.82rem; color: #111827; line-height: 1.4; font-weight: 500; }
.gp-check-item.checked .gp-check-text { color: #9ca3af; text-decoration: line-through; }
.gp-check-detail { font-size: 0.7rem; color: #6b7280; margin-top: 2px; line-height: 1.4; }
.gp-check-links { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
.gp-check-phone, .gp-check-url { font-size: 0.63rem; font-weight: 600; padding: 2px 7px; border-radius: 5px; border: 1px solid; text-decoration: none; }
.gp-check-phone { background: #eff6ff; color: #2563eb; border-color: #bfdbfe; }
.gp-check-url { background: #f0fdf4; color: #16a34a; border-color: #bbf7d0; }
#gp-btn { width: 100%; padding: 12px 16px; border-radius: 8px; border: none; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all .2s; }
#gp-btn.ready { background: linear-gradient(135deg, #0d9488, #16a34a); color: white; box-shadow: 0 2px 12px rgba(13,148,136,.35); }
#gp-btn.ready:hover { transform: translateY(-1px); box-shadow: 0 4px 18px rgba(13,148,136,.45); }
#gp-btn.locked { background: #f1f5f9; color: #94a3b8; cursor: default; }
@keyframes gp-celebrate { 0%{transform:scale(1)} 25%{transform:scale(1.04)} 75%{transform:scale(0.98)} 100%{transform:scale(1)} }
.gp-celebrate { animation: gp-celebrate .5s ease; }
#gp-next-up { padding: 10px 18px; background: #fffbeb; border-top: 1px solid #fde68a; display: flex; align-items: center; gap: 8px; }
#gp-next-label { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; color: #d97706; white-space: nowrap; }
#gp-next-text { font-size: 0.78rem; font-weight: 600; color: #92400e; }
.gp-locked-item { display: flex; align-items: center; gap: 10px; padding: 9px 18px; border-top: 1px solid var(--border); }
.gp-lock-icon { font-size: 0.75rem; color: #d1d5db; flex-shrink: 0; }
.gp-lock-title { flex: 1; font-size: 0.78rem; font-weight: 600; color: #d1d5db; }
.gp-lock-when { font-size: 0.6rem; color: #d1d5db; white-space: nowrap; }

@media (max-width: 580px) { #projects { grid-template-columns: 1fr; } #page { padding: 14px 12px 60px; } #header { padding: 12px 14px; } }
</style>
</head>
<body>

<div id="header">
  <h1>🎯 Mission <span>Control</span></h1>
  <div id="header-right">
    <span id="date-display"></span>
    <button class="ctrl-btn" onclick="confirmReset()">↺ Reset</button>
  </div>
</div>

<div id="mission-bar">
  <span id="mission-icon">🎯</span>
  <span id="mission-label">Now&nbsp;·&nbsp;</span>
  <span id="mission-text">Loading…</span>
</div>

<div id="page">

  <div class="section-card">
    <div id="focus-header">
      <div><div id="focus-title">📋 Today's Focus</div><div id="focus-date"></div></div>
      <span id="focus-count"></span>
    </div>
    <div id="focus-body"></div>
  </div>

  <div class="section-card" id="gp-section"></div>

  <div class="section-card" id="overlap-section">
    <div id="overlap-toggle" onclick="toggleOverlaps()">
      <div id="overlap-toggle-left">
        <span>⚡</span>
        <span id="overlap-label">Overlap Alerts</span>
        <span id="overlap-pill"></span>
      </div>
      <span id="overlap-chevron">▼</span>
    </div>
    <div id="overlap-body"></div>
  </div>

  <div id="projects"></div>

</div>

<script>
const OVERLAP_GROUPS = [
  { id:'og1', label:'Call VA Clinic (850-912-2000) — ONE CALL covers TWO projects', desc:'Ask: (1) A&A increase $1,117→$1,558/mo, (2) home modification programs for surviving spouses (HISA is for veterans only — ask what IS available), (3) VSO referral.', projects:'💰 VA Benefits + 🏠 Home Repair', taskIds:['repair-7','va-call-va-clinic'] },
  { id:'og2', label:'Gather documents — ONE SESSION covers TWO projects', desc:'DD-214 · SSA award letter · DFAS pension · 3 months bank statements · homestead exemption. Needed for BOTH VA filing AND all home repair applications.', projects:'🏠 Home Repair + 💰 VA Benefits', taskIds:['repair-1','va-docs-gather'] }
];

const CATEGORY = { repair:'🏠 Home Repair', va:'💰 VA Benefits' };

const PROJECTS = [
  { id:'repair', name:"Home Repair — Mom's House", icon:'🏠', color:'#ea580c', desc:"Veteran's widow · Pensacola / Escambia County", tasks:[
    { id:'repair-1',    text:'Gather all documents before any calls', deadline:'TODAY — First', urgent:true, overlap:'og2', notes:'OVERLAP with VA Benefits — same gather. DD-214 or death cert · SSA award letter · DFAS pension · 3 months bank statements · homestead exemption proof.' },

// STATE
let taskStatus    = {};
let openArchives  = {};
let overlapsOpen  = true;
let questState    = { current: 0, checks: {} };
let expandedTasks   = {};
let expandedOverlaps = {};
let focusDeferred = [];
let focusDeferredDate = '';

function dateStr() { return new Date().toISOString().slice(0,10); }

function loadState() {
  try {
    const s = localStorage.getItem('mc3_status');   if (s) taskStatus   = JSON.parse(s);
    const a = localStorage.getItem('mc3_archives'); if (a) openArchives = JSON.parse(a);
    const o = localStorage.getItem('mc3_overlaps'); if (o !== null) overlapsOpen = JSON.parse(o);
    const q = localStorage.getItem('mc3_quest');    if (q) questState = JSON.parse(q);
    const fd = localStorage.getItem('mc_fd');
    if (fd) { const p = JSON.parse(fd); const today = dateStr(); if (p.date === today) { focusDeferred = p.ids || []; focusDeferredDate = p.date; } }
  } catch(e) {}
}
function saveState() {
  localStorage.setItem('mc3_status',   JSON.stringify(taskStatus));
  localStorage.setItem('mc3_archives', JSON.stringify(openArchives));
  localStorage.setItem('mc3_overlaps', JSON.stringify(overlapsOpen));
  localStorage.setItem('mc3_quest',    JSON.stringify(questState));
  localStorage.setItem('mc_fd',        JSON.stringify({date: focusDeferredDate, ids: focusDeferred}));
}
function getStatus(id) { return taskStatus[id] || 'todo'; }

function setStatus(id, st, e) {
  if (e) e.stopPropagation();
  taskStatus[id] = st;
  for (const og of OVERLAP_GROUPS) {
    if (!og.taskIds.includes(id)) continue;
    for (const tid of og.taskIds) {
      if (st === 'done') taskStatus[tid] = 'done';
      else if (st === 'inprogress' && getStatus(tid) === 'todo') taskStatus[tid] = 'inprogress';
      else if (st === 'todo') taskStatus[tid] = 'todo';
    }
  }
  saveState();
  renderAll();
}

// RENDER
function renderAll() {
  renderHeader();
  renderMission();
  renderFocus();
  renderQuest();
  renderOverlaps();
  renderProjects();
}

function toggleCheck(mi, cid) {
  const checks = questState.checks[mi] || [];
  const idx = checks.indexOf(cid);
  if (idx === -1) checks.push(cid); else checks.splice(idx, 1);
  questState.checks[mi] = checks;
  saveState();
  renderQuest();
}

let _questFiring = false;
function completeMission() {
  if (_questFiring) return;
  const mi = questState.current;
  const m = MISSIONS[mi];
  if (!m) return;
  const checks = questState.checks[mi] || [];
  if (!m.checks.every(c => checks.includes(c.id))) return;
  _questFiring = true;
  const btn = document.getElementById('gp-btn');
  if (btn) { btn.disabled = true; btn.textContent = '✓ Mission Complete!'; btn.classList.add('gp-celebrate'); }
  setTimeout(() => { _questFiring = false; questState.current = mi + 1; saveState(); renderQuest(); }, 600);
}

function renderQuest() {
  const el = document.getElementById('gp-section');
  if (!el) return;
  const mi = questState.current;
  const total = MISSIONS.length;
  const pct = Math.round((mi / total) * 100);

  let dots = '';
  for (let i = 0; i < total; i++) {
    if (i < mi) dots += '<div class="gp-dot done"></div>';
    else if (i === mi) dots += '<div class="gp-dot current"></div>';
    else dots += '<div class="gp-dot"></div>';
  }

  let doneHtml = '';
  for (let i = 0; i < mi && i < total; i++) {
    const m = MISSIONS[i];
    doneHtml += `<div class="gp-done-item"><div class="gp-done-check">✓</div><div class="gp-done-text">Mission ${i+1} — ${m.title}</div><div class="gp-done-when">${m.when}</div></div>`;
  }

  const header = `<div id="gp-header"><div id="gp-title-row"><div id="gp-title">🗺️ Your Quest</div><div id="gp-badge">${mi >= total ? 'Complete!' : `Mission ${mi+1} of ${total}`}</div></div><div id="gp-progress-dots">${dots}</div><div id="gp-bar-wrap"><div id="gp-bar-fill" style="width:${pct}%"></div></div></div>`;

  if (mi >= total) {
    el.innerHTML = header + doneHtml + `<div style="padding:22px;text-align:center;font-size:0.9rem;color:#16a34a;font-weight:800;">🏆 All missions complete. You did it.</div>`;
    return;
  }

  const m = MISSIONS[mi];
  const checks = questState.checks[mi] || [];
  const allChecked = m.checks.every(c => checks.includes(c.id));

  let checksHtml = '';
  for (const c of m.checks) {
    const done = checks.includes(c.id);
    checksHtml += `<div class="gp-check-item${done?' checked':''}" onclick="toggleCheck(${mi},'${c.id}')">
      <div class="gp-checkbox">${done?'✓':''}</div>
      <div class="gp-check-content">
        <div class="gp-check-text">${c.text}</div>
        ${c.detail?`<div class="gp-check-detail">${c.detail}</div>`:''}
        <div class="gp-check-links">
          ${c.phone?`<a class="gp-check-phone" href="tel:${c.phone.replace(/[^0-9]/g,'')}" onclick="event.stopPropagation()">📞 ${c.phone}</a>`:''}
          ${c.url?`<a class="gp-check-url" href="https://${c.url}" target="_blank" onclick="event.stopPropagation()">🔗 ${c.url}</a>`:''}
        </div>
      </div>
    </div>`;
  }

  const nextM = MISSIONS[mi + 1];
  const nextUp = nextM ? `<div id="gp-next-up"><span id="gp-next-label">Next up</span><span id="gp-next-text">Mission ${mi+2} — ${nextM.title}</span></div>` : '';

  let lockedHtml = '';
  const lockedStart = nextM ? mi + 2 : mi + 1;
  for (let i = lockedStart; i < total; i++) {
    const lm = MISSIONS[i];
    lockedHtml += `<div class="gp-locked-item"><div class="gp-lock-icon">🔒</div><div class="gp-lock-title">Mission ${i+1} — ${lm.title}</div><div class="gp-lock-when">${lm.when}</div></div>`;
  }

  el.innerHTML = header + doneHtml + `
    <div id="gp-active">
      <div class="gp-mission-num">Mission ${mi+1} of ${total}</div>
      <div class="gp-mission-title">${m.title}</div>
      <div class="gp-mission-when">${m.when}</div>
      <div class="gp-mission-why">${m.why}</div>
      <div class="gp-checks">${checksHtml}</div>
      <button id="gp-btn" class="${allChecked?'ready':'locked'}" onclick="completeMission()" ${allChecked?'':'disabled'}>
        ${allChecked ? (mi + 1 < total ? `Complete Mission ${mi+1} &rarr; Unlock Mission ${mi+2}` : `Complete Mission ${mi+1} &rarr; Finish Quest 🏆`) : `Check all ${m.checks.length} items above to continue`}
      </button>
    </div>
    ${nextUp}
    <div id="gp-locked">${lockedHtml}</div>`;
}

function renderHeader() {
  const d = new Date();
  document.getElementById('date-display').textContent =
    d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
  document.getElementById('focus-date').textContent =
    d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
}

function renderMission() {
  const candidates = [];
  for (const p of PROJECTS) for (const t of p.tasks) if (getStatus(t.id) !== 'done') candidates.push({t,p});
  candidates.sort((a,b) => {
    const so = {inprogress:0,todo:1};
    const sa = so[getStatus(a.t.id)]??1, sb = so[getStatus(b.t.id)]??1;
    if (sa!==sb) return sa-sb;
    return (a.t.urgent?0:1)-(b.t.urgent?0:1);
  });
  if (!candidates.length) {
    document.getElementById('mission-icon').textContent = '🏆';
    document.getElementById('mission-text').textContent = 'All missions complete.';
    return;
  }
  const {t,p} = candidates[0];
  document.getElementById('mission-icon').textContent = getStatus(t.id)==='inprogress' ? '⚡' : '🎯';
  document.getElementById('mission-text').textContent =
    p.icon + ' ' + t.text.replace(/^[^\w\s]*\s*/,'') + (t.deadline ? ' · ' + t.deadline : '');
}

function buildFocusList() {
  const seen = new Set(), result = [];
  const add = (t,pid) => { if (seen.has(t.id) || getStatus(t.id)==='done') return; seen.add(t.id); result.push({t,pid}); };
  for (const p of PROJECTS) for (const t of p.tasks) if (getStatus(t.id)==='inprogress') add(t,p.id);
  const ovU=[],ovO=[];
  for (const p of PROJECTS) for (const t of p.tasks) if (t.overlap && getStatus(t.id)!=='done') (t.urgent?ovU:ovO).push({t,pid:p.id});
  for (const i of [...ovU,...ovO]) add(i.t,i.pid);
  for (const p of PROJECTS) for (const t of p.tasks) if (t.urgent && getStatus(t.id)!=='done') add(t,p.id);
  if (result.length<8) for (const p of PROJECTS) for (const t of p.tasks)
    if (!t.urgent && t.deadline && !['Stage','Phase','After'].some(x=>t.deadline.startsWith(x)) && getStatus(t.id)!=='done') add(t,p.id);
  return result.slice(0,8);
}

function renderFocus() {
  const body = document.getElementById('focus-body');
  const day = new Date().getDay();
  if (day===0 || day===6) {
    document.getElementById('focus-count').textContent = 'Weekend';
    body.innerHTML = `<div class="focus-weekend"><div class="w-emoji">🌿</div><div class="w-main">Do one good thing for you today.</div><div class="w-sub">Your projects will be here Monday. Today is yours.</div></div>`;
    return;
  }

  // Reset deferred list if it's a new day
  const today = dateStr();
  if (focusDeferredDate !== today) { focusDeferred = []; focusDeferredDate = today; }

  const allItems = buildFocusList();
  const activeItems = allItems.filter(i => !focusDeferred.includes(i.t.id));
  const deferredItems = allItems.filter(i => focusDeferred.includes(i.t.id));
  const queue = [...activeItems, ...deferredItems];

  const totalInQueue = queue.length;
  const doneCount = allItems.filter(i => getStatus(i.t.id) === 'done').length;
  const totalCount = allItems.length;

  document.getElementById('focus-count').textContent =
    totalInQueue === 0 ? 'All clear ✓' : `${doneCount} of ${totalCount} done`;

  if (!totalInQueue) {
    body.innerHTML = '<div class="focus-empty">🏆 All priority tasks complete today.</div>';
    return;
  }

  const current = queue[0];
  if (!current) { body.innerHTML = '<div class="focus-empty">🏆 All priority tasks complete today.</div>'; return; }

  const {t, pid} = current;
  const proj = PROJECTS.find(p => p.id === pid);
  const og = t.overlap ? OVERLAP_GROUPS.find(o => o.id === t.overlap) : null;
  const afterThis = totalInQueue - 1;

  body.innerHTML = `<div id="focus-single">
    <div class="fs-meta">
      ${t.urgent ? `<span class="fs-urgent-badge"><span class="fs-urgent-dot"></span>URGENT</span>` : ''}
      ${proj ? `<span class="fs-proj-tag">${proj.icon} ${proj.name}</span>` : ''}
      ${t.overlap ? `<span class="fs-overlap-badge">⚡ Covers 2 projects</span>` : ''}
    </div>
    <div class="fs-title">${t.text.replace(/^[^\w\s]*\s*/,'')}</div>
    ${t.notes ? `<div class="fs-notes">${t.notes}</div>` : ''}
    ${(t.phone || t.url) ? `<div class="fs-links">
      ${t.phone ? `<a class="fs-phone" href="tel:${t.phone.replace(/[^0-9]/g,'')}">📞 ${t.phone}</a>` : ''}
      ${t.url ? `<a class="fs-url" href="https://${t.url}" target="_blank">🔗 ${t.url}</a>` : ''}
    </div>` : ''}
    <div class="fs-actions">
      <button class="fs-btn-done" onclick="focusDone('${t.id}')">✓ Done${afterThis > 0 ? ' — Next Task →' : ' — Finish 🏆'}</button>
      ${afterThis > 0 ? `<button class="fs-btn-skip" onclick="focusDefer('${t.id}')">Later Today ↓</button>` : ''}
    </div>
    <div class="fs-remaining">${afterThis > 0 ? `${afterThis} more task${afterThis===1?'':'s'} after this one` : 'Last task on the list.'}</div>
  </div>`;
}

function focusDone(id) { setStatus(id, 'done'); }

function focusDefer(id) {
  focusDeferredDate = dateStr();
  if (!focusDeferred.includes(id)) focusDeferred.push(id);
  saveState();
  renderFocus();
}

function renderOverlaps() {
  const active = OVERLAP_GROUPS.filter(og=>og.taskIds.some(id=>getStatus(id)!=='done'));
  document.getElementById('overlap-pill').textContent = active.length ? active.length : '✓';
  document.getElementById('overlap-chevron').style.transform = overlapsOpen ? 'rotate(180deg)' : '';
  const body = document.getElementById('overlap-body');
  body.style.display = overlapsOpen ? 'block' : 'none';
  if (!active.length) { body.innerHTML = '<div style="padding:10px 16px;font-size:0.78rem;color:#16a34a;font-weight:600;">✅ All overlap tasks complete!</div>'; return; }
  body.innerHTML = active.map(og => {
    const isExp = !!expandedOverlaps[og.id];
    return `<div class="overlap-row${isExp?' ov-expanded':''}" id="ovrow-${og.id}">
      <div class="ov-top" onclick="toggleOverlapRow('${og.id}')">
        <span class="ov-badge">⚡ Saves Time</span>
        <span class="ov-title">${og.label}</span>
        <span class="ov-expand">›</span>
      </div>
      <div class="ov-details">
        <div class="ov-desc">${og.desc}</div>
        <div class="ov-projects">${og.projects}</div>
      </div>
    </div>`;
  }).join('');
}

function toggleOverlapRow(id) {
  expandedOverlaps[id] = !expandedOverlaps[id];
  const row = document.getElementById('ovrow-'+id);
  if (row) row.classList.toggle('ov-expanded', !!expandedOverlaps[id]);
}

function toggleOverlaps() { overlapsOpen = !overlapsOpen; saveState(); renderOverlaps(); }

function renderProjects() {
  const grid = document.getElementById('projects');
  grid.innerHTML = '';
  for (const p of PROJECTS) {
    const total = p.tasks.length;
    const doneN = p.tasks.filter(t=>getStatus(t.id)==='done').length;
    const active    = p.tasks.filter(t=>getStatus(t.id)!=='done');
    const completed = p.tasks.filter(t=>getStatus(t.id)==='done');
    const pct = total ? Math.round(doneN/total*100) : 0;
    const urgentA = active.filter(t=>t.urgent);
    const weekA   = active.filter(t=>!t.urgent && t.deadline && !['Stage','Phase','After'].some(x=>t.deadline.startsWith(x)));
    const laterA  = active.filter(t=>!t.urgent && (!t.deadline || ['Stage','Phase','After'].some(x=>t.deadline.startsWith(x))));
    let bodyHtml = '';
    if (active.length===0) {
      bodyHtml = `<div class="proj-done-banner">🏆 All tasks complete!</div>`;
    } else {
      if (urgentA.length) bodyHtml += `<div class="task-group-lbl urgent">🔴 Urgent</div>` + urgentA.map(taskRowHtml).join('');
      if (weekA.length)   bodyHtml += `<div class="task-group-lbl week">This Week</div>` + weekA.map(taskRowHtml).join('');
      if (laterA.length)  bodyHtml += `<div class="task-group-lbl">Later</div>` + laterA.map(taskRowHtml).join('');
    }
    if (completed.length) {
      const isOpen = !!openArchives[p.id];
      bodyHtml += `<div class="done-drawer">
        <span class="done-toggle" onclick="toggleArchive('${p.id}')">${isOpen?'▾':'▸'} ${doneN} completed</span>
        <div class="done-list" id="arch-${p.id}" style="display:${isOpen?'block':'none'}">
          ${completed.map(t=>`<div class="done-row"><div class="done-row-text">${t.text.replace(/^[^\w\s]*\s*/,'')}</div><button class="restore-btn" onclick="setStatus('${t.id}','todo',event)">↩ Restore</button></div>`).join('')}
        </div>
      </div>`;
    }
    const card = document.createElement('div');
    card.className = 'proj-card collapsed';
    card.id = 'proj-'+p.id;
    card.innerHTML = `
      <div class="proj-head" style="background:${p.color}" onclick="toggleProj('${p.id}')">
        <span class="proj-icon">${p.icon}</span>
        <div class="proj-info">
          <div class="proj-name">${p.name}</div>
          <div class="proj-desc">${p.desc}</div>
          <div class="proj-prog-wrap">
            <div class="proj-bar"><div class="proj-bar-fill" style="width:${pct}%"></div></div>
            <span class="proj-frac">${doneN}/${total}</span>
          </div>
        </div>
        <span class="proj-chev">▼</span>
      </div>
      <div class="proj-body">${bodyHtml}</div>`;
    grid.appendChild(card);
  }
}

function taskRowHtml(t) {
  const st = getStatus(t.id);
  const exp = !!expandedTasks[t.id];
  const hasDetails = t.notes || t.phone || t.url || t.overlap;
  let rowCls = 'task-row';
  if (t.urgent)          rowCls += ' urgent-row';
  if (st==='inprogress') rowCls += ' inprog';
  if (exp)               rowCls += ' expanded';
  const og = t.overlap ? OVERLAP_GROUPS.find(o=>o.id===t.overlap) : null;
  return `<div class="${rowCls}" id="tr-${t.id}"${hasDetails?` onclick="toggleTask('${t.id}')"`:''}>\
    <div class="task-top">
      <div class="task-dot"></div>
      <div class="task-label">${t.text.replace(/^[^\w\s]*\s*/,'')}</div>
      <div class="task-right">
        ${t.deadline?`<span class="t-deadline">${t.deadline}</span>`:''}
        ${t.overlap&&st!=='done'?'<span class="t-overlap-dot" title="Completes multiple projects">⚡</span>':''}
        <button class="t-btn t-btn-prog${st==='inprogress'?' on':''}" onclick="setStatus('${t.id}','inprogress',event)">▶</button>
        <button class="t-btn t-btn-done" onclick="setStatus('${t.id}','done',event)">✓</button>
        ${hasDetails?'<span class="t-expand">›</span>':''}
      </div>
    </div>
    ${hasDetails?`<div class="task-details">
      ${t.notes?`<div class="task-notes">${t.notes}</div>`:''}
      <div class="task-links">
        ${t.phone?`<a class="t-phone" href="tel:${t.phone.replace(/[^0-9]/g,'')}" onclick="event.stopPropagation()">📞 ${t.phone}</a>`:''}
        ${t.url?`<a class="t-url" href="https://${t.url}" target="_blank" onclick="event.stopPropagation()">🔗 ${t.url}</a>`:''}
        ${t.overlap?`<span class="t-overlap-detail">⚡ ${og?og.projects:'Multi-project'}</span>`:''}
      </div>
    </div>`:''}
  </div>`;
}

function toggleTask(id) {
  expandedTasks[id] = !expandedTasks[id];
  const row = document.getElementById('tr-'+id);
  if (row) row.classList.toggle('expanded', !!expandedTasks[id]);
}

function toggleProj(id) {
  const card = document.getElementById('proj-'+id);
  if (card) card.classList.toggle('collapsed');
}

function toggleArchive(pid) {
  openArchives[pid] = !openArchives[pid];
  saveState();
  const el = document.getElementById('arch-'+pid);
  const toggle = el?el.previousElementSibling:null;
  if (el) el.style.display = openArchives[pid]?'block':'none';
  if (toggle) toggle.innerHTML = `${openArchives[pid]?'▾':'▸'} ${el.children.length} completed`;
}

function confirmReset() {
  if (confirm('Reset all tasks and quest progress to the beginning?')) {
    taskStatus = {};
    questState = { current: 0, checks: {}, _v2: true };
    focusDeferred = []; focusDeferredDate = '';
    saveState();
    renderAll();
  }
}

loadState();
// One-time migration: clear any stale quest state saved before the mission-skip fix (v2)
if (!questState._v2) { questState = { current: 0, checks: {}, _v2: true }; saveState(); }
// Pre-mark ineligible tasks as done if the user hasn't explicitly changed them
if (!taskStatus['va-pcafc']) { taskStatus['va-pcafc'] = 'done'; saveState(); }
renderAll();
setInterval(()=>{ renderHeader(); renderMission(); }, 60000);
</script>
</body>
</html>
